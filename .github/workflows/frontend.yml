name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'lowpoint/verdict.py'
      - 'lowpoint/config.py'
      - 'tests/test_frontend_story.py'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'lowpoint/verdict.py'
      - 'lowpoint/config.py'
      - 'tests/test_frontend_story.py'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  story:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validar exemplo contra o veredito real
        run: python -m pytest tests/test_frontend_story.py -q
