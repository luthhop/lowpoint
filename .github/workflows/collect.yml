name: Coleta de preços

on:
  # Reserva do /api/tick. Horários do GitHub são UTC (BRT = UTC-3).
  schedule:
    # O ano todo, :17 de cada hora (fora do :00, horário de pico do GitHub).
    - cron: "17 * * * *"
    # BF, 23/11 00:00 a 27/11 23:59 UTC = 22/11 21:00 a 27/11 20:59 BRT.
    # Com o :17 acima, dá um disparo a cada 15 min.
    - cron: "2,32,47 * 23-27 11 *"
    # BF, 28/11 00:00 a 02:59 UTC = 27/11 21:00 a 23:59 BRT (últimas 3h).
    - cron: "2,32,47 0-2 28 11 *"
  workflow_dispatch:

concurrency:
  group: lowpoint-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m lowpoint.collect --once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Notificar falha no Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_failure.py
